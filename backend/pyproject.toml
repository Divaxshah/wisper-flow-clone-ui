[project]
name = "backend"
version = "0.1.0"
description = "Realtime Nemotron ASR with pause-delimited sentence cleanup"
readme = "README.md"
authors = [
    { name = "Divaxshah", email = "divax.shah@avinyaaedtech.com" }
]
requires-python = ">=3.10"
dependencies = [
    "anyio>=4.0",
    "fastapi>=0.141.1",
    "numpy>=2.2.6",
    "openai>=3.13.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
